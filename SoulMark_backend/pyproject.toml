[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "soulmark-backend"
version = "0.1.0"
description = "Backend API for SoulMark"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "alibabacloud-dypnsapi20170525>=2.0,<3.0",
    "alibabacloud-dysmsapi20170525>=4.5,<5.0",
    "certifi>=2025.1.31",
    "email-validator>=2.2,<3.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pillow>=11.0,<13.0",
    "psycopg[binary]>=3.2,<4.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "pyjwt>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
    "websockets>=15,<18",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1.0",
    "mypy>=1.14,<2.0",
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.25,<2.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "alibabacloud_dypnsapi20170525.*",
    "alibabacloud_dysmsapi20170525.*",
    "alibabacloud_tea_openapi.*",
]
ignore_missing_imports = true
