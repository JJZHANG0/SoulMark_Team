services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soulmark
      POSTGRES_USER: soulmark
      POSTGRES_PASSWORD: soulmark_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soulmark -d soulmark"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - soulmark_postgres_data:/var/lib/postgresql/data

  api:
    build: .
    env_file:
      - .env
    environment:
      SOULMARK_ENVIRONMENT: development
      SOULMARK_DATABASE_URL: postgresql+psycopg://soulmark:soulmark_local@db:5432/soulmark
      SOULMARK_JWT_SECRET: local-compose-secret-change-before-production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - soulmark_avatar_uploads:/app/uploads

volumes:
  soulmark_postgres_data:
  soulmark_avatar_uploads:
